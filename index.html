<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six Tenses — English Grammar Practice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --board:#1f3630;
  --board-deep:#16261f;
  --chalk:#f4efe1;
  --chalk-dim:#b9c4ba;
  --mustard:#e8b339;
  --mustard-soft:#f3d488;
  --coral:#e2725b;
  --good:#6fae67;
  --good-bg:rgba(111,174,103,.16);
  --bad:#e2725b;
  --bad-bg:rgba(226,114,91,.16);
  --card:#fffdf8;
  --card-line:#e4ddc8;
  --ink:#24312c;
  --muted:#736a56;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 500px at 10% -10%, #2c4b42 0%, transparent 55%),
    radial-gradient(800px 460px at 105% 15%, #24413a 0%, transparent 55%),
    var(--board);
  color:var(--chalk);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:30px 16px 60px;
}
.app{width:100%; max-width:740px;}

a.home-link{
  display:inline-flex; align-items:center; gap:6px;
  color:var(--chalk-dim); text-decoration:none; font-size:13px;
  font-weight:500; margin-bottom:18px; opacity:.85;
}
a.home-link:hover{color:var(--mustard-soft);}

.masthead{text-align:center; margin-bottom:26px;}
.masthead .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--mustard-soft); font-weight:600; margin-bottom:10px;
}
.masthead h1{
  font-family:'Caveat', cursive;
  font-size:52px; font-weight:700; margin:0 0 6px; line-height:1.05;
  position:relative; display:inline-block;
}
.masthead .sub{color:var(--chalk-dim); font-size:14.5px; max-width:480px; margin:8px auto 0;}

.chalk-underline{display:block; margin:4px auto 0;}

.card{
  background:var(--card);
  color:var(--ink);
  border-radius:var(--radius);
  box-shadow:0 22px 50px -20px rgba(0,0,0,.55);
  padding:30px 28px;
  position:relative;
}
.card.tilt{transform:rotate(-0.6deg);}
.tape{
  position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-2deg);
  width:90px; height:26px; background:rgba(232,179,57,.55);
  border:1px solid rgba(232,179,57,.7);
}

.section-label{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:700;letter-spacing:.02em;}

.topics{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px;}
.topic-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px; font-weight:600; padding:7px 13px;
  border-radius:20px; border:1.5px solid var(--card-line);
  background:#fbf9f2; color:var(--muted); cursor:pointer;
  transition:all .15s ease;
}
.topic-chip.active{background:var(--board); color:var(--chalk); border-color:var(--board);}
.topic-chip:hover{border-color:var(--mustard);}

.diff-row{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 24px;}
.diff-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px; font-weight:700; padding:8px 14px;
  border-radius:20px; border:1.5px solid var(--card-line);
  background:#fbf9f2; color:var(--muted); cursor:pointer;
  transition:all .15s ease;
}
.diff-chip.active.d-easy{background:var(--good); border-color:var(--good); color:#fff;}
.diff-chip.active.d-medium{background:var(--mustard); border-color:var(--mustard); color:#3d3011;}
.diff-chip.active.d-hard{background:#c9762f; border-color:#c9762f; color:#fff;}
.diff-chip.active.d-very_hard{background:var(--coral); border-color:var(--coral); color:#fff;}
.diff-chip.active.d-all{background:var(--board); border-color:var(--board); color:var(--chalk);}
.diff-chip:hover{border-color:var(--mustard);}

.stat-row{display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
.stat-box{flex:1; min-width:130px; border:1px solid var(--card-line); border-radius:10px; padding:12px 14px; background:#fbf9f2;}
.stat-box .num{font-family:'Caveat', cursive; font-size:30px; font-weight:700; color:var(--board); line-height:1;}
.stat-box .label{font-size:12px; color:var(--muted); margin-top:4px;}

.btn{
  display:block; width:100%; text-align:center; padding:15px 18px;
  border-radius:10px; border:none; font-family:'IBM Plex Sans',sans-serif;
  font-size:16px; font-weight:600; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary{
  background:linear-gradient(180deg, var(--board) 0%, var(--board-deep) 100%);
  color:var(--chalk);
  box-shadow:0 10px 24px -10px rgba(22,38,31,.6);
}
.btn-primary:hover{transform:translateY(-1px);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed; transform:none;}

.hidden{display:none !important;}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:13px; color:var(--chalk-dim);}
.topbar .counter{font-weight:700; color:var(--chalk); font-family:'IBM Plex Mono', monospace;}
.topbar .tag{color:var(--mustard-soft); font-weight:600; font-family:'IBM Plex Mono', monospace; font-size:12px;}
.home-btn{
  background:none; border:1.5px solid rgba(244,239,225,.25); color:var(--chalk-dim);
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
  padding:5px 12px; border-radius:20px; cursor:pointer; transition:all .15s ease;
}
.home-btn:hover{border-color:var(--mustard); color:var(--mustard-soft);}
.progress-track{height:7px; background:rgba(244,239,225,.14); border-radius:20px; overflow:hidden; margin-bottom:20px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--mustard-soft), var(--mustard)); border-radius:20px; transition:width .25s ease;}

.pill-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tense-pill{
  display:inline-block; font-family:'IBM Plex Mono', monospace;
  font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:20px;
  background:var(--good-bg); color:#3d6b3a;
}
.diff-pill{
  display:inline-block; font-family:'IBM Plex Mono', monospace;
  font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:20px;
}
.diff-pill.d-easy{background:var(--good-bg); color:#2e5b2b;}
.diff-pill.d-medium{background:rgba(232,179,57,.18); color:#8a6212;}
.diff-pill.d-hard{background:rgba(201,118,47,.18); color:#a35a1f;}
.diff-pill.d-very_hard{background:var(--bad-bg); color:#8a352a;}

.prompt{font-size:19px; font-weight:600; line-height:1.5; margin-bottom:22px;}
.prompt .blank{border-bottom:2.5px solid var(--mustard); padding:0 4px;}

.options{display:flex; flex-direction:column; gap:10px;}
.option{
  text-align:left; padding:13px 16px; border-radius:9px;
  border:1.5px solid var(--card-line); background:#fff;
  font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:var(--ink);
  cursor:pointer; transition:all .12s ease;
}
.option:hover:not(.locked){border-color:var(--mustard); background:#fffaf0;}
.option.locked{cursor:default;}
.option.correct{background:var(--good-bg); border-color:var(--good); color:#2e5b2b; font-weight:600;}
.option.incorrect{background:var(--bad-bg); border-color:var(--bad); color:#8a352a; font-weight:600;}
.option.dim{opacity:.5;}

.feedback{margin-top:16px; padding:12px 14px; border-radius:9px; font-size:14px; font-weight:600; display:none;}
.feedback.show{display:block;}
.feedback.good{background:var(--good-bg); color:#2e5b2b;}
.feedback.bad{background:var(--bad-bg); color:#8a352a;}

.nav-row{display:flex; gap:10px; margin-top:24px;}
.nav-row .btn{flex:1;}
.btn-ghost{background:#fff; color:var(--ink); border:1.5px solid var(--card-line);}
.btn-ghost:disabled{opacity:.4;}

.score-hero{text-align:center; margin-bottom:24px;}
.score-hero .big{font-family:'Caveat', cursive; font-size:64px; font-weight:700; color:var(--board); line-height:1;}
.score-hero .pct{font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--muted); margin-top:6px;}

.breakdown{display:flex; flex-direction:column; gap:10px; margin:22px 0;}
.bd-row{display:flex; align-items:center; gap:10px; font-size:13px;}
.bd-label{width:150px; flex-shrink:0; color:var(--muted); font-weight:600;}
.bd-track{flex:1; height:8px; background:#f0ece0; border-radius:20px; overflow:hidden;}
.bd-fill{height:100%; background:linear-gradient(90deg, var(--mustard-soft), var(--mustard)); border-radius:20px;}
.bd-num{width:44px; text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600;}

.review-item{border:1px solid var(--card-line); border-radius:10px; padding:14px 16px; margin-bottom:10px; background:#fbf9f2;}
.review-item .q{font-weight:600; margin-bottom:8px;}
.review-item .row{font-size:13.5px; margin-bottom:3px;}
.review-item .your{color:var(--bad);}
.review-item .correct{color:var(--good);}
</style>
</head>

        <button class="btn btn-ghost" id="btn-prev" onclick="goPrev()">Previous</button>
        <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="screen-results" class="hidden card tilt">
    <div class="tape"></div>
    <div class="score-hero">
      <div class="big" id="score-num">0/0</div>
      <div class="pct" id="score-pct">0%</div>
    </div>
    <p style="font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px;">Breakdown by tense</p>
    <div class="breakdown" id="breakdown"></div>
    <div id="review-wrap"></div>
    <button class="btn btn-primary" onclick="resetToStart()" style="margin-top:10px;">Practice again</button>
  </div>
</div>

const TOPICS = ["Present Simple","Past Simple","Present Continuous","Present Perfect","Going To","Will"];
const DIFFS = [["all","All levels"],["easy","Easy"],["medium","Medium"],["hard","Hard"],["very_hard","Very Hard"]];
const DIFF_LABEL = {easy:"Easy", medium:"Medium", hard:"Hard", very_hard:"Very Hard"};

let currentSet = [];
let currentIndex = 0;
let answers = {};
let activeTopic = 'all';
let activeDiff = 'all';

function countFor(topic, diff){
  return QUESTIONS.filter(q => (topic==='all'||q.topic===topic) && (diff==='all'||q.difficulty===diff)).length;
}

function renderDiffChips(){
  const wrap = document.getElementById('diff-chips');
  wrap.innerHTML = '';
  DIFFS.forEach(([key,label]) => {
    const chip = document.createElement('div');
    chip.className = 'diff-chip d-' + key + (key==='all' ? ' active' : '');
    chip.innerText = label;
    chip.onclick = () => { activeDiff = key; document.querySelectorAll('.diff-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); renderTopicChips(); };
    wrap.appendChild(chip);
  });
}

function renderTopicChips(){
  const wrap = document.getElementById('topic-chips');
  const prevActive = activeTopic;
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'topic-chip' + (activeTopic==='all' ? ' active' : '');
  allChip.innerText = 'All (' + countFor('all', activeDiff) + ')';
  allChip.onclick = () => selectTopic('all', allChip);
  wrap.appendChild(allChip);
  TOPICS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'topic-chip' + (activeTopic===t ? ' active' : '');
    chip.innerText = t + ' (' + countFor(t, activeDiff) + ')';
    chip.onclick = () => selectTopic(t, chip);
    wrap.appendChild(chip);
  });
}
function selectTopic(t, el){
  activeTopic = t;
  document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function startQuiz(){
  currentSet = QUESTIONS.filter(q => (activeTopic==='all'||q.topic===activeTopic) && (activeDiff==='all'||q.difficulty===activeDiff));
  if(currentSet.length === 0){ alert('No questions match that combination — try a different filter.'); return; }
  currentIndex = 0;
  answers = {};
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  const label = (activeTopic==='all'?'All tenses':activeTopic) + ' · ' + (activeDiff==='all'?'All levels':DIFF_LABEL[activeDiff]);
  document.getElementById('quiz-mode-label').innerText = label;
  document.getElementById('q-total').innerText = currentSet.length;
  renderQuestion();
}

function renderQuestion(){
  const item = currentSet[currentIndex];
  document.getElementById('q-index').innerText = currentIndex+1;
  document.getElementById('progress-fill').style.width = (currentIndex/currentSet.length*100)+'%';
  document.getElementById('tense-pill').innerText = item.topic;
  const dp = document.getElementById('diff-pill');
  dp.innerText = DIFF_LABEL[item.difficulty];
  dp.className = 'diff-pill d-' + item.difficulty;
  document.getElementById('q-prompt').innerHTML = item.prompt.replace('____', '<span class="blank">____</span>');

  const wrap = document.getElementById('q-options');
  wrap.innerHTML = '';
  const prev = answers[item.id];
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerText = opt;
    btn.onclick = () => selectOption(idx);
    wrap.appendChild(btn);
  });

  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  if(prev !== undefined) applyVisuals(item, prev.selectedIndex);

  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = prev === undefined;
  document.getElementById('btn-next').innerText = currentIndex === currentSet.length-1 ? 'See results' : 'Next';
}

function selectOption(idx){
  const item = currentSet[currentIndex];
  if(answers[item.id] !== undefined) return;
  const isCorrect = idx === item.correct;
  answers[item.id] = {selectedIndex: idx, isCorrect};
  applyVisuals(item, idx);
  document.getElementById('btn-next').disabled = false;
}

function applyVisuals(item, selectedIdx){
  const btns = document.querySelectorAll('#q-options .option');
  btns.forEach((b, idx) => {
    b.classList.add('locked');
    if(idx === item.correct) b.classList.add('correct');
    else if(idx === selectedIdx) b.classList.add('incorrect');
    else b.classList.add('dim');
  });
  const fb = document.getElementById('q-feedback');
  const correct = selectedIdx === item.correct;
  fb.className = 'feedback show ' + (correct ? 'good' : 'bad');
  fb.innerText = correct ? 'Correct!' : ('Not quite — correct answer: ' + item.options[item.correct]);
}

function goNext(){
  if(currentIndex < currentSet.length-1){ currentIndex++; renderQuestion(); }
  else finishQuiz();
}
function goPrev(){
  if(currentIndex > 0){ currentIndex--; renderQuestion(); }
}

function finishQuiz(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');

  let correctCount = 0;
  currentSet.forEach(it => { if(answers[it.id] && answers[it.id].isCorrect) correctCount++; });
  const total = currentSet.length;
  const pct = total ? Math.round(correctCount/total*100) : 0;
  document.getElementById('score-num').innerText = correctCount + ' / ' + total;
  document.getElementById('score-pct').innerText = pct + '% correct';

  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';
  const topicsInSet = [...new Set(currentSet.map(q => q.topic))];
  topicsInSet.forEach(t => {
    const items = currentSet.filter(q => q.topic === t);
    const correct = items.filter(q => answers[q.id] && answers[q.id].isCorrect).length;
    const p = Math.round(correct/items.length*100);
    const row = document.createElement('div');
    row.className = 'bd-row';
    row.innerHTML = '<div class="bd-label">'+t+'</div><div class="bd-track"><div class="bd-fill" style="width:'+p+'%"></div></div><div class="bd-num">'+correct+'/'+items.length+'</div>';
    bd.appendChild(row);
  });

  const wrongOnes = currentSet.filter(it => answers[it.id] && !answers[it.id].isCorrect);
  const reviewWrap = document.getElementById('review-wrap');
  reviewWrap.innerHTML = '';
  if(wrongOnes.length){
    const heading = document.createElement('p');
    heading.style.cssText = 'font-size:14px;color:var(--muted);font-weight:600;margin:22px 0 10px;';
    heading.innerText = 'Review missed questions';
    reviewWrap.appendChild(heading);
    wrongOnes.forEach(it => {
      const a = answers[it.id];
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = '<div class="q">'+it.prompt+'</div>'+
        '<div class="row your">Your answer: '+it.options[a.selectedIndex]+'</div>'+
        '<div class="row correct">Correct answer: '+it.options[it.correct]+'</div>';
      reviewWrap.appendChild(div);
    });
  }
}

function resetToStart(){
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}

renderDiffChips();
renderTopicChips();
</script>
